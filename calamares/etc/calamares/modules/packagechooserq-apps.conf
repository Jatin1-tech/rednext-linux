---
# Optional apps (the page itself is branding/rednext/rednext-apps.qml). Nothing here is on the ISO: ticked apps are downloaded from
# their official sources during install (needs internet), by the rednextapps job.
mode: optional
method: legacy
qmlSearch: both
qmlFilename: rednext-apps
labels:
    step: "Extra apps"
items:
    - id: ""
      name: "No extra apps"
      description: "RedNext comes complete without these. Tick any apps you want and the installer downloads them from their official sources at the end of the install (needs internet). You can pick several."
      screenshot: "/etc/calamares/branding/rednext/welcome.png"
    - id: blender
      name: "Blender"
      description: "3D modelling, animation and rendering. About 400 MB download, from blender.org."
      screenshot: "/etc/calamares/branding/rednext/apps/blender.png"
    - id: spotify
      name: "Spotify"
      description: "Music streaming client. About 130 MB download, from Spotify's official repository."
      screenshot: "/etc/calamares/branding/rednext/apps/spotify.png"
    - id: intellij
      name: "IntelliJ IDEA"
      description: "Java/Kotlin IDE by JetBrains (bundles its own Java runtime). About 1.5 GB download, from jetbrains.com."
      screenshot: "/etc/calamares/branding/rednext/apps/intellij.png"
    - id: pycharm
      name: "PyCharm"
      description: "Python IDE by JetBrains. About 1.2 GB download, from jetbrains.com."
      screenshot: "/etc/calamares/branding/rednext/apps/pycharm.png"
    - id: rider
      name: "Rider"
      description: ".NET / C# IDE by JetBrains. About 2.3 GB download, from jetbrains.com."
      screenshot: "/etc/calamares/branding/rednext/apps/rider.png"
