---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - { name: wheel,  must_exist: false, system: true }
    - { name: audio,  must_exist: false, system: true }
    - { name: video,  must_exist: false, system: true }
    - { name: input,  must_exist: false, system: true }
    - { name: lp,     must_exist: false, system: true }
    - { name: kvm,    must_exist: false, system: true }
    - { name: netdev, must_exist: false, system: true }
sudoersGroup: wheel
sudoersConfigureWithGroup: false
setRootPassword: false
doReusePassword: false
doAutologin: false
passwordRequirements:
    minLength: 1
    maxLength: -1
allowWeakPasswords: false   # with only minLength 1 checked, this makes an empty password invalid
allowWeakPasswordsDefault: false
user:
    shell: /usr/bin/fish
    forbidden_names: [ root, live ]
    home_permissions: "o700"
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "rednext-${cpu}"
    forbidden_names: [ localhost, rednext-live ]
qmlSearch: both
qmlFilename: rednext-users
