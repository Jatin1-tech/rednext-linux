# RedNext installer (Calamares). Shipped only in the live image.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:     apps
  module: packagechooserq
  config: packagechooserq-apps.conf
- id:     prepare
  module: shellprocess
  config: shellprocess-prepare.conf

sequence:
- show:
  - welcomeq
  - locale
  - keyboard
  - rednextdisk
  - usersq
  - packagechooserq@apps
  - summaryq
- exec:
  # rednextdisk partitions, formats and mounts (incl. proc/sys/dev) via rednext-disk commit
  - rednextdisk
  - unpackfs
  - machineid
  - fstab
  - localecfg
  - keyboard
  - shellprocess@prepare
  - usersq
  - networkcfg
  - hwclock
  - rednextapps
  - bootloader
  - umount
- show:
  - finishedq

branding: rednext
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
